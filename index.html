  <script>
  'use strict';
  (() => {
    const STORAGE_KEY = 'macromate:v1';
    const ACTIVITY = {sedentary:1.2,light:1.375,moderate:1.55,very:1.725,extra:1.9};
    const MEALS = ['breakfast','lunch','dinner','snacks'];
    const COLORS = {protein:'var(--primary)',carbs:'var(--orange)',fat:'var(--purple)'};
    const DEFAULTS = {profile:null,settings:{units:'metric',dark:true,macros:{protein:30,carbs:40,fat:30}},days:{},favorites:[],recent:[],customFoods:[],weights:[]};
    let state = load();
    let view = 'home', selectedDate = today(), pickerMeal = 'breakfast', pickerTab = 'search';
    let pickerFoods = [], pickerQuery = '', pickerTimer = null, pickerController = null;
    let scannerStream = null, scannerRAF = 0, scannerReading = false;

    let toastTimer = null, apiSearchTimes = []; 
    const $ = (selector,root=document) => root.querySelector(selector);
    const $$ = (selector,root=document) => Array.from(root.querySelectorAll(selector));

    function addDays(k,n){const d=dateObj(k);d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

    function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3300)}
    const unitWeight = () => state.settings.units==='imperial'?'lb':'kg';
    const toDisplayWeight = kg => state.settings.units==='imperial'?kg*2.2046226218:kg;
    const fromWeight = (w,units) => units==='imperial'?w/2.2046226218:w;
    const weightText = kg => `${fmt(toDisplayWeight(kg),1)} ${unitWeight()}`;

    function currentMass(){const candidates=state.weights.filter(w=>w.date<=today()&&finite(w.kg)&&w.kg>0).sort((a,b)=>a.date.localeCompare(b.date));return candidates.length?num(candidates.at(-1).kg):num(state.profile.weightKg)}

    function getDay(k=selectedDate){if(!state.days[k])state.days[k]={entries:[],water:0,exercises:[]};const d=state.days[k];if(!Array.isArray(d.entries))d.entries=[];if(!Array.isArray(d.exercises))d.exercises=[];d.water=clamp(num(d.water)||0,0,30000);return d}

    function dayTotals(day){const entries=day.entries||[];const exercise=totalOf((day.exercises||[]).map(x=>x.kcal));return {kcal:totalOf(entries.map(x=>x.kcal)),protein:totalOf(entries.map(x=>x.protein)),carbs:totalOf(entries.map(x=>x.carbs)),fat:totalOf(entries.map(x=>x.fat)),exercise}}

    function toggleFavorite(food){const key=foodKey(food);if(favorite(food))state.favorites=state.favorites.filter(f=>foodKey(f)!==key);else state.favorites.unshift(food);save()}
    function remember(food){state.recent=[food,...state.recent.filter(f=>foodKey(f)!==foodKey(food))].slice(0,30)}
    function progressLine(label,value,target,color,unit='g'){const percent=target>0?value/target*100:0;return `<div class="macro-item"><div class="space"><div class="flex"><span style="display:inline-block;width:9px;height:9px;background:${color};border-radius:50%"></span><b style="font-size:14px">${esc(label)}</b></div><span class="sub mono">${fmt(value,1)} / ${fmt(target)} ${unit}</span></div><div class="bar"><div style="width:${clamp(percent,0,100)}%;background:${color}"></div></div><div class="sub" style="text-align:right">${fmt(Math.abs(target-value),1)} ${unit} ${value>target?'over':'remaining'}</div></div>`}
    function render(){document.body.classList.toggle('dark',!!state.settings.dark);$('#app').innerHTML=state.profile?renderLayout():renderWelcome();if(state.profile&&view==='progress')requestAnimationFrame(drawChart)}
    function renderLayout(){return `<div class="app"><header class="top"><div class="brand"><span class="brandmark"><img src="./icon.svg" alt="" width="42" height="42"></span><span>MacroMate</span></div><div class="flex"><span class="offline" ${navigator.onLine?'hidden':''}>Offline</span><button class="avatar" data-act="goto" data-view="settings" aria-label="Settings">⚙️</button></div></header>${view==='home'?renderHome():view==='progress'?renderProgress():view==='settings'?renderSettings():renderMath()}</div><nav class="nav" aria-label="Main navigation">${[['home','⌂','Home'],['progress','▥','Progress'],['math','∑','Goals'],['settings','⚙','Profile']].map(([v,i,label])=>`<button class="${v===view?'active':''}" data-act="goto" data-view="${v}" aria-label="${label}"><span class="ni">${i}</span>${label}</button>`).join('')}</nav>`}
    function renderHome(){const c=calc(),d=getDay(),t=dayTotals(d),allowed=c.cal+t.exercise,remaining=allowed-t.kcal;const dateCtl=`<div class="date-nav"><button class="iconbutton" data-act="date-prev" aria-label="Previous day">‹</button><div class="date-current"><b>${esc(niceDate(selectedDate))}</b><input type="date" id="datePicker" value="${selectedDate}" aria-label="Choose diary date"></div><button class="iconbutton" data-act="date-next" aria-label="Next day">›</button></div>`;return `<div class="eyebrow">YOUR DAILY DASHBOARD</div><div class="h1">Make today count <span style="color:#b86bff">✦</span></div>${dateCtl}<section class="card target" style="--cal-progress:${clamp(t.kcal/Math.max(allowed,1)*100,0,100)}%"><div class="space"><b>Daily calories</b><span class="pill">${t.exercise?'+'+fmt(t.exercise)+' exercise':'Daily budget'}</span></div><div class="cal-ring"><div class="cal-ring-inner"><span class="flame">✦</span><div class="ring-total">${fmt(t.kcal)} <small>/ ${fmt(allowed)}</small></div><span class="ring-label">kcal eaten</span><strong>${fmt(remaining)} left</strong></div></div><div class="cal-track"><div class="cal-fill" style="width:${clamp(t.kcal/allowed*100,0,100)}%"></div></div><div class="space"><span class="sub">Base target ${fmt(c.cal)} kcal</span><span class="sub">${fmt(t.kcal/allowed*100)}% used</span></div></section>${c.clamped?`<div class="warning">⚠️ Your selected pace would put you below the ${fmt(c.floor)} kcal safety floor. MacroMate uses the floor instead. <button class="textlink" data-act="goto" data-view="math">See calculation</button></div>`:''}<section class="card"><div class="space"><h2 class="h2">Today's macros</h2><span class="tag">${c.macros.protein}/${c.macros.carbs}/${c.macros.fat}</span></div>${progressLine('Protein',t.protein,c.protein,COLORS.protein)}${progressLine('Carbs',t.carbs,c.carbs,COLORS.carbs)}${progressLine('Fat',t.fat,c.fat,COLORS.fat)}<button class="more" data-act="goto" data-view="settings">Adjust macro split →</button></section><section class="card"><div class="space"><h2 class="h2">💧 Water</h2><span class="waterstats mono">${fmt(d.water)} <small class="sub">/ ${fmt(c.water)} ml</small></span></div><div class="bar" style="height:11px;margin-top:13px"><div class="water" style="width:${clamp(d.water/c.water*100,0,100)}%"></div></div><div class="water-quick"><button class="button secondary small" data-act="water" data-ml="250">+250 ml</button><button class="button secondary small" data-act="water" data-ml="500">+500 ml</button><button class="button ghost small" data-act="water" data-ml="-250">−250 ml</button></div></section><div class="quick-actions"><button class="quick-action primary" data-act="add-food" data-meal="lunch"><span>🍴</span>Add Food</button><button class="quick-action" data-act="exercise"><span>🏃</span>Exercise</button><button class="quick-action" data-act="water" data-ml="250"><span>💧</span>+250 ml</button></div><a href="./mma.html" class="gym-cta">🥊 MMA Fighter Mode <span>Fight camp · Skills · Sparring →</span></a><a href="./wellness.html" class="gym-cta">✦ Wellness Hub <span>Meals · Recovery · Health →</span></a><a href="./workouts.html" class="gym-cta">🏋️ Workout Studio <span>Plans · Sets · Progress →</span></a><a href="./gym.html" class="gym-cta">🏋️ Explore Gym Library <span>55 exercises · Technique & safety →</span></a><div class="space" style="margin:23px 2px 13px"><h2 class="h2">Meals</h2><span class="sub">${d.entries.length} items</span></div>${MEALS.map(meal=>renderMeal(meal,d.entries)).join('')}<section class="card"><div class="space"><div><h2 class="h2">Exercise</h2><p class="sub" style="margin:4px 0 0">${fmt(t.exercise)} kcal added back</p></div><button class="button secondary small" data-act="exercise">+ Exercise</button></div>${d.exercises.map(x=>`<div class="meal-row" style="padding-left:0;padding-right:0"><div><b>${esc(x.name)}</b><div class="sub">+${fmt(x.kcal)} kcal</div></div><button class="iconbutton" aria-label="Delete exercise" data-act="delete-exercise" data-id="${esc(x.id)}">×</button></div>`).join('')}</section><div class="tiny" style="text-align:center;padding:6px">MacroMate estimates are educational, not medical advice. Verify food labels.</div>`}
    function renderMeal(meal,entries){const items=entries.filter(x=>x.meal===meal),kcal=totalOf(items.map(x=>x.kcal));const icon={breakfast:'☀️',lunch:'🥗',dinner:'🍲',snacks:'🍓'}[meal];return `<section class="card meal"><div class="space meal-header"><div class="flex"><span style="font-size:23px">${icon}</span><div><h3 class="h2" style="text-transform:capitalize">${meal}</h3><span class="sub">${fmt(kcal)} kcal</span></div></div><button class="button secondary small" data-act="add-food" data-meal="${meal}">+ Add</button></div>${items.length?items.map(x=>`<div class="meal-row"><button style="background:none;border:0;text-align:left;padding:0;flex:1;color:var(--text)" data-act="edit-entry" data-id="${esc(x.id)}"><div class="title">${esc(x.name)}</div><div class="sub">${x.quick?'Quick add':`${fmt(x.grams,1)} g · ${fmt(x.quantity,2)} serving${x.quantity===1?'':'s'}`} · P ${fmt(x.protein,1)} / C ${fmt(x.carbs,1)} / F ${fmt(x.fat,1)}</div></button><b class="mono" style="font-size:13px;white-space:nowrap">${fmt(x.kcal)} kcal</b><button class="iconbutton" aria-label="Delete food" data-act="delete-entry" data-id="${esc(x.id)}">×</button></div>`).join(''):`<div class="empty" style="padding:10px 18px 19px">Nothing logged for ${meal} yet.</div>`}</section>`}
    function renderProgress(){const c=calc();const last7=Array.from({length:7},(_,i)=>addDays(today(),i-6));const logged=last7.filter(k=>(state.days[k]?.entries||[]).length>0);const avg=logged.length?totalOf(logged.map(k=>dayTotals(state.days[k]).kcal))/logged.length:0;let streak=0,day=today();if(!(state.days[day]?.entries||[]).length)day=addDays(day,-1);while((state.days[day]?.entries||[]).length){streak++;day=addDays(day,-1);if(streak>36500)break}const weights=state.weights.filter(w=>finite(w.kg)&&w.kg>0).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="eyebrow">Your journey</div><div class="h1">Progress & trends</div><div class="metric" style="margin-bottom:15px"><section class="card"><div class="sub">Current weight</div><div class="smallstat">${fmt(toDisplayWeight(c.w),1)}</div><div class="sub">${unitWeight()}</div></section><section class="card"><div class="sub">Goal weight</div><div class="smallstat">${fmt(toDisplayWeight(c.p.goalWeightKg),1)}</div><div class="sub">${unitWeight()}</div></section><section class="card"><div class="sub">7-day calorie average</div><div class="smallstat">${logged.length?fmt(avg):'—'}</div><div class="sub">${logged.length} logged day${logged.length===1?'':'s'}</div></section><section class="card"><div class="sub">Food diary streak</div><div class="smallstat">${streak} 🔥</div><div class="sub">consecutive days</div></section></div><section class="card"><div class="space"><h2 class="h2">Weight history</h2><button class="button secondary small" data-act="log-weight">+ Log weight</button></div>${weights.length?`<canvas id="weightChart" class="chart" aria-label="Weight history line chart" role="img"></canvas>`:`<div class="empty">No weigh-ins yet. Add your first one.</div>`}<div class="sub" style="margin:4px 0">${weights.length} weigh-in${weights.length===1?'':'s'} · latest: ${weights.length?esc(niceDate(weights.at(-1).date)):'—'}</div>${weights.slice(-10).reverse().map(w=>`<div class="meal-row" style="padding-left:0;padding-right:0"><div><b>${weightText(w.kg)}</b><div class="sub">${esc(w.date)}</div></div><button class="iconbutton" data-act="delete-weight" data-id="${esc(w.id)}" aria-label="Delete weight">×</button></div>`).join('')}</section><section class="card"><h2 class="h2">Goal estimate</h2><div class="big-number" style="font-size:25px;margin:10px 0">${c.goalDate?esc(dateObj(c.goalDate).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})):'No date estimated'}</div><p class="sub">${c.goalDate?'Based on your current weight and selected pace. Actual progress will vary.':'Choose a matching gain/loss goal and pace to estimate a date.'}</p><div class="divider"></div><div class="space"><span class="dim">Body mass index (BMI)</span><b>${fmt(c.bmi,1)}</b></div><p class="tiny">BMI is a screening estimate and does not distinguish muscle from fat.</p></section>`}
    function drawChart(){const canvas=$('#weightChart');if(!canvas)return;const pts=state.weights.filter(w=>finite(w.kg)&&w.kg>0).sort((a,b)=>a.date.localeCompare(b.date));const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect(),width=Math.max(240,rect.width),height=235;canvas.width=width*dpr;canvas.height=height*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,width,height);const dark=!!state.settings.dark;ctx.font='12px sans-serif';ctx.textBaseline='middle';if(!pts.length)return;const kgValues=pts.map(w=>toDisplayWeight(w.kg)),min=Math.min(...kgValues),max=Math.max(...kgValues),lo=Math.floor(min-1),hi=Math.ceil(max+1);const left=48,right=17,top=24,bottom=39,W=width-left-right,H=height-top-bottom;for(let j=0;j<5;j++){const y=top+j*H/4;ctx.strokeStyle=dark?'#35415a':'#e5ebf4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(left+W,y);ctx.stroke();ctx.fillStyle=dark?'#aab6cd':'#75839d';ctx.textAlign='right';ctx.fillText(fmt(hi-(hi-lo)*j/4,1),left-7,y)}const dates=pts.map(w=>dateObj(w.date).getTime()),xMin=dates[0],xMax=dates.at(-1);const x=i=>xMax===xMin?left+W/2:left+(dates[i]-xMin)/(xMax-xMin)*W;const y=v=>top+(hi-v)/(hi-lo)*H;ctx.strokeStyle=dark?'#9da8ff':'#5669ef';ctx.lineWidth=3;ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(x(i),y(kgValues[i])):ctx.moveTo(x(i),y(kgValues[i])));ctx.stroke();pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(x(i),y(kgValues[i]),3.8,0,Math.PI*2);ctx.fillStyle=dark?'#abb3ff':'#5669ef';ctx.fill()});ctx.fillStyle=dark?'#aab6cd':'#75839d';ctx.textAlign='left';ctx.fillText(dateObj(pts[0].date).toLocaleDateString(undefined,{month:'short',day:'numeric'}),left,height-14);ctx.textAlign='right';ctx.fillText(dateObj(pts.at(-1).date).toLocaleDateString(undefined,{month:'short',day:'numeric'}),width-right,height-14)}
    function renderSettings(){const m=state.settings.macros,c=calc();return `<div class="eyebrow">Make it yours</div><div class="h1">Settings</div><section class="card"><div class="space"><div><h2 class="h2">Your profile</h2><div class="sub">${state.profile.age} years · ${state.profile.sex==='male'?'Male':'Female'} equation · ${fmt(state.profile.heightCm)} cm</div></div><button class="button secondary small" data-act="edit-profile">Edit</button></div><div class="divider"></div><div class="space"><span class="dim">Goal</span><b style="text-transform:capitalize">${esc(state.profile.goal)}</b></div><div class="space" style="margin-top:9px"><span class="dim">Current / goal</span><b>${weightText(c.w)} / ${weightText(c.p.goalWeightKg)}</b></div><div class="space" style="margin-top:9px"><span class="dim">Calorie target</span><b>${fmt(c.cal)} kcal</b></div></section><section class="card"><h2 class="h2">Macro percentages</h2><p class="sub">Moving one slider adjusts the others to keep the total at 100% (minimum 10% each).</p>${['protein','carbs','fat'].map(key=>`<div class="range-row"><label class="label" for="macro-${key}" style="margin:0;text-transform:capitalize">${key}</label><b data-macro-value="${key}">${m[key]}%</b></div><input id="macro-${key}" data-macro="${key}" type="range" min="10" max="80" step="1" value="${m[key]}">`).join('')}<div class="note" id="macroPreview">At ${fmt(c.cal)} kcal: ${c.protein} g protein · ${c.carbs} g carbs · ${c.fat} g fat</div><button class="button ghost small" data-act="reset-macros">Reset to 30 / 40 / 30</button></section><section class="card"><h2 class="h2">Appearance & units</h2><div class="switch-row"><span>Dark mode</span><input id="darkToggle" type="checkbox" ${state.settings.dark?'checked':''} aria-label="Dark mode"></div><div class="switch-row"><span>Measurement units</span><div class="toggle"><button class="${state.settings.units==='metric'?'active':''}" data-act="set-units" data-units="metric">Metric</button><button class="${state.settings.units==='imperial'?'active':''}" data-act="set-units" data-units="imperial">Imperial</button></div></div></section><section class="card"><h2 class="h2">Your data</h2><p class="sub">Everything is stored only in this browser. Export regularly: clearing site data or changing devices can erase it.</p><div class="stack"><button class="button secondary full" data-act="export">↓ Export JSON backup</button><button class="button ghost full" data-act="import">↑ Import JSON backup</button><input type="file" id="importFile" accept="application/json,.json" hidden><button class="button danger full" data-act="clear">Clear all data</button></div></section><section class="card"><h2 class="h2">About MacroMate</h2><p class="sub">Free, offline-first, no sign-up, no analytics, no ads. Online food search uses crowd-sourced <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener noreferrer">Open Food Facts</a> data (ODbL license). Its nutrition values can be incomplete or wrong. Check the package label.</p><p class="sub">⚕️ MacroMate is not medical advice. Calorie, water and goal-date estimates are approximate. Consult a qualified clinician or dietitian if you are under 18, pregnant, managing a health condition or planning aggressive weight loss.</p></section>`}
    function renderMath(){const c=calc(),p=c.p,sexPart=p.sex==='male'?'+ 5':'− 161';const actLabel={sedentary:'Sedentary',light:'Lightly active',moderate:'Moderately active',very:'Very active',extra:'Extra active'}[p.activity];const goalOp=p.goal==='lose'?'−':p.goal==='gain'?'+':'=';const goalInfo=p.goal==='maintain'?'No calorie adjustment':`${fmt(p.paceKg,2)} kg/week × 7,700 ÷ 7 = ${fmt(c.dailyDifference)} kcal/day`;return `<div class="eyebrow">Transparent targets</div><div class="h1">How this is calculated</div><section class="card"><h2 class="h2">1. Basal metabolic rate (BMR)</h2><p class="sub">Mifflin–St Jeor: kcal burned at rest, using ${p.sex==='male'?'the +5':'the −161'} constant.</p><div class="math">10 × weight (kg) + 6.25 × height (cm) − 5 × age ${sexPart}<br>10 × ${fmt(c.w,1)} + 6.25 × ${fmt(p.heightCm,1)} − 5 × ${p.age} ${sexPart} = <b>${fmt(c.base)} kcal</b></div><h2 class="h2">2. Total daily energy (TDEE)</h2><p class="sub">Activity multipliers: sedentary 1.2; lightly active 1.375; moderately active 1.55; very active 1.725; extra active 1.9.</p><div class="math">BMR × ${ACTIVITY[p.activity]} (${actLabel})<br>${fmt(c.base)} × ${ACTIVITY[p.activity]} = <b>${fmt(c.tdee)} kcal</b></div><h2 class="h2">3. Your calorie budget</h2><div class="math">${esc(goalInfo)}<br>TDEE ${goalOp} ${fmt(c.dailyDifference)} = ${fmt(c.raw)} kcal<br>Safety minimum (${p.sex==='male'?'male':'female'}): ${fmt(c.floor)} kcal/day<br><b>Final target = ${fmt(c.cal)} kcal/day</b></div>${c.clamped?'<div class="warning">⚠️ Your requested pace exceeds the recommended floor used here. Your actual loss will likely be slower than the chosen pace.</div>':''}<p class="sub">The 7,700 kcal/kg approximation is simplistic. Real metabolism and weight changes are not linear.</p><h2 class="h2">4. Macros</h2><div class="math">Protein: ${fmt(c.cal)} × ${c.macros.protein}% ÷ 4 = <b>${c.protein} g</b><br>Carbs: ${fmt(c.cal)} × ${c.macros.carbs}% ÷ 4 = <b>${c.carbs} g</b><br>Fat: ${fmt(c.cal)} × ${c.macros.fat}% ÷ 9 = <b>${c.fat} g</b></div><h2 class="h2">5. BMI & water</h2><div class="math">BMI = ${fmt(c.w,1)} ÷ (${fmt(p.heightCm/100,2)}²) = <b>${fmt(c.bmi,1)}</b><br>Water ≈ 35 ml/kg capped to 2–4 L, rounded to 250 ml<br><b>${fmt(c.water)} ml/day</b></div><p class="sub">Water needs depend on heat, exercise, diet and health. This is a starting estimate, not a requirement.</p><h2 class="h2">6. Estimated goal date</h2><div class="math">${c.goalDays===null?'Not applicable to this goal':`${fmt(Math.abs((p.goalWeightKg-c.w)),1)} kg to target ÷ ${fmt(c.effectivePace,3)} kg/week (estimated effective pace) × 7 ≈ ${c.goalDays} days`}<br><b>${c.goalDate?esc(dateObj(c.goalDate).toDateString()):'—'}</b></div><p class="sub">This date is theoretical; it does not predict plateaus, fluid shifts or changing energy needs.</p></section>`}
    function field(label,id,value,type='number',extra=''){return `<div class="form-row"><label class="label" for="${id}">${label}</label><input class="field" id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
    function profileFormHtml(p){const imperial=profileFormUnits==='imperial';const feet=Math.floor(p.heightCm/30.48);const inches=round((p.heightCm-feet*30.48)/2.54,1);return `<form id="profileForm"><div class="form-row"><label class="label">Units</label><div class="toggle"><button type="button" class="${!imperial?'active':''}" data-act="profile-units" data-units="metric">Metric (kg/cm)</button><button type="button" class="${imperial?'active':''}" data-act="profile-units" data-units="imperial">Imperial (lb/ft)</button></div></div><div class="form-grid">${field('Age (18+)','pAge',p.age,'number','min="18" max="110" required step="1"')}<div class="form-row"><label class="label" for="pSex">Sex (for BMR equation)</label><select id="pSex" class="field"><option value="male" ${p.sex==='male'?'selected':''}>Male equation (+5)</option><option value="female" ${p.sex==='female'?'selected':''}>Female equation (−161)</option></select></div></div>${imperial?`<div class="form-grid">${field('Height (feet)','pFeet',feet,'number','min="3" max="8" step="1" required')}${field('Height (inches)','pInches',inches,'number','min="0" max="11.99" step="0.1" required')}</div>`:field('Height (cm)','pHeight',round(p.heightCm,1),'number','min="100" max="260" step="0.1" required')}<div class="form-grid">${field('Current weight ('+(imperial?'lb':'kg')+')','pWeight',round(imperial?p.weightKg*2.2046226218:p.weightKg,1),'number','min="1" max="1000" step="0.1" required')}${field('Goal weight ('+(imperial?'lb':'kg')+')','pGoalWeight',round(imperial?p.goalWeightKg*2.2046226218:p.goalWeightKg,1),'number','min="1" max="1000" step="0.1" required')}</div><div class="form-row"><label class="label" for="pActivity">Activity level</label><select class="field" id="pActivity">${[['sedentary','Sedentary (little exercise)'],['light','Lightly active (1–3 days/week)'],['moderate','Moderately active (3–5 days/week)'],['very','Very active (6–7 days/week)'],['extra','Extra active (physical job + training)']].map(([v,s])=>`<option value="${v}" ${p.activity===v?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-grid"><div class="form-row"><label class="label" for="pGoal">Goal</label><select class="field" id="pGoal"><option value="lose" ${p.goal==='lose'?'selected':''}>Lose weight</option><option value="maintain" ${p.goal==='maintain'?'selected':''}>Maintain</option><option value="gain" ${p.goal==='gain'?'selected':''}>Gain weight</option></select></div><div class="form-row" id="paceRow" ${p.goal==='maintain'?'hidden':''}><label class="label" for="pPace">${p.goal==='gain'?'Gain':'Loss'} per week</label><select class="field" id="pPace">${[.25,.5,.75,1].map(x=>`<option value="${x}" ${Math.abs(num(p.paceKg)-x)<.01?'selected':''}>${imperial?fmt(x*2.2046226218,2)+' lb':x+' kg'}</option>`).join('')}</select></div></div><p class="help">This tool is designed for adults. Your settings use the selected BMR equation, not a medical assessment.</p><button class="button full" type="submit">${editingProfile?'Save profile & recalculate':'Start tracking →'}</button></form>`}
    function initialProfile(){return {age:18,sex:'male',heightCm:175,weightKg:80,goalWeightKg:75,activity:'light',goal:'lose',paceKg:.5}}

    async function searchFoods(query){
      clearTimeout(pickerTimer);
      if(pickerController)pickerController.abort();
      const term=query.trim(),lower=term.toLowerCase();
      if(term.length<2){pickerFoods=[];paintFoodResults('Enter at least 2 characters.');return}
      const local=FOOD_CATALOG.filter(f=>f.name.toLowerCase().includes(lower)).slice(0,35);
      if(!navigator.onLine){pickerFoods=local;paintFoodResults(local.length?'':'Offline: no matching food. Try a different name or add a custom food.');return}
      apiSearchTimes=apiSearchTimes.filter(t=>Date.now()-t<60000);
      if(apiSearchTimes.length>=12){pickerFoods=local;paintFoodResults(local.length?'':'Online search temporarily limited. Try again shortly.');return}
      apiSearchTimes.push(Date.now());
      pickerController=new AbortController();
      const signal=pickerController.signal;
      pickerFoods=local;paintFoodResults(local.length?'':'Searching foods worldwide…');
      const fields='code,product_name,product_name_en,brands,serving_size,nutriments';
      const endpoints=[
        'https://world.openfoodfacts.org/cgi/search.pl?'+new URLSearchParams({search_terms:term,search_simple:'1',action:'process',json:'1',page_size:'100',fields}),
        'https://world.openfoodfacts.org/api/v2/search?'+new URLSearchParams({search_terms:term,page_size:'100',fields})
      ];
      let products=[],error='';
      for(const url of endpoints){
        try{
          const response=await fetch(url,{signal,headers:{Accept:'application/json'}});
          if(!response.ok)throw Error('Search service returned '+response.status);
          const data=await response.json();
          products=Array.isArray(data.products)?data.products:[];
          if(products.length)break;
        }catch(err){if(err.name==='AbortError')return;error=err.message||'Connection error'}
      }
      if(signal.aborted||pickerTab!=='search'||pickerQuery.trim()!==term)return;
      const seen=new Set(local.map(f=>f.name.toLowerCase()));
      const online=products.map(foodFromOFF).filter(Boolean).filter(f=>{
        const name=f.name.toLowerCase(),key=(f.code||name);
        if(seen.has(key)||seen.has(name))return false;
        seen.add(key);seen.add(name);return true;
      }).sort((x,y)=>{
        const score=f=>{let n=f.name.toLowerCase();return (n===lower?100:n.startsWith(lower)?50:n.includes(lower)?20:0)};
        return score(y)-score(x)
      });
      pickerFoods=[...local,...online].slice(0,100);
      paintFoodResults(pickerFoods.length?'':error?'Online food search is unavailable. Check your connection or create a custom food.':'No results in the public database. Try another name, a brand, or create a custom food.');
    }
    function openFoodEntry(f,meal=pickerMeal,editingId=null){const existing=editingId?getDay().entries.find(e=>e.id===editingId):null;const grams=existing?existing.grams:f.portionG||100,quantity=existing?existing.quantity:1;openModal(sheetTitle(existing?'Edit food':'Add food')+`<div class="space"><div><b>${esc(f.name)}</b><div class="sub">${esc(f.brand||f.source||'')}</div></div><button class="button secondary small" data-act="favorite-food" id="favoriteButton">${favorite(f)?'★ Saved':'☆ Favorite'}</button></div><p class="sub">Reference: ${fmt(f.per100.kcal)} kcal / 100 g</p><form id="addFoodForm"><div class="form-grid">${field('Grams per serving','servingGrams',grams,'number','min="0.1" max="5000" step="0.1" required')}${field('Number of servings','servingsCount',quantity,'number','min="0.01" max="100" step="0.01" required')}</div><div class="note" id="portionPreview"></div><button class="button full" type="submit">${existing?'Save changes':'Add to '+meal}</button></form>`);$('#overlay').dataset.food=JSON.stringify(f);$('#overlay').dataset.meal=meal;$('#overlay').dataset.editId=editingId||'';updatePortionPreview()}
    function updatePortionPreview(){const raw=$('#overlay').dataset.food;if(!raw)return;const f=JSON.parse(raw);const grams=num($('#servingGrams')?.value),qty=num($('#servingsCount')?.value);const target=$('#portionPreview');if(!target)return;if(!(grams>0&&qty>0&&grams<=5000&&qty<=100)){target.textContent='Enter a valid serving size and quantity.';return}const n=foodNutrition(f,grams,qty);target.textContent=`${fmt(n.kcal)} kcal · ${fmt(n.protein,1)} g protein · ${fmt(n.carbs,1)} g carbs · ${fmt(n.fat,1)} g fat (total ${fmt(grams*qty,1)} g)`}
    function addEntry(food,meal,grams,quantity,editId){const n=foodNutrition(food,grams,quantity);const d=getDay();if(editId){const i=d.entries.findIndex(x=>x.id===editId);if(i>=0)d.entries[i]={...d.entries[i],name:food.name,food,grams,quantity,...n}}else d.entries.push({id:uid(),meal,name:food.name,food,grams,quantity,quick:false,...n});remember(food);save();closeModal();render();toast(editId?'Food updated':'Added to '+meal)}
    function openCustom(){openModal(sheetTitle('Create a custom food')+`<form id="customForm">${field('Food name','customName','','text','maxlength="130" required placeholder="e.g. homemade chicken sandwich"')}${field('Brand (optional)','customBrand','','text','maxlength="100"')}<div class="form-grid">${field('Grams per serving','customGrams',100,'number','min="0.1" max="5000" step="0.1" required')}${field('How many servings?','customQty',1,'number','min="0.01" max="100" step="0.01" required')}</div><p class="sub">Nutrition values for ONE serving (not per 100 g):</p><div class="form-grid">${field('Calories (kcal)','customKcal',0,'number','min="0" max="20000" step="0.1" required')}${field('Protein (g)','customProtein',0,'number','min="0" max="1000" step="0.1" required')}${field('Carbs (g)','customCarbs',0,'number','min="0" max="1000" step="0.1" required')}${field('Fat (g)','customFat',0,'number','min="0" max="1000" step="0.1" required')}</div><div class="switch-row"><label for="customFav">Save to favorites too</label><input id="customFav" type="checkbox"></div><button class="button full" type="submit">Save food & add to ${pickerMeal}</button></form>`)}
    function openQuick(existing=null){openModal(sheetTitle(existing?'Edit quick calories':'Quick-add calories')+`<form id="quickForm">${field('Description','quickName',existing?.name||'Quick calories','text','maxlength="130" required')}${field('Calories (kcal)','quickKcal',existing?.kcal??0,'number','min="0" max="20000" step="0.1" required')}<p class="help">Quick calories count toward your energy total, but do not add protein, carbs or fat.</p><button class="button full" type="submit">${existing?'Save calories':'Add to '+pickerMeal}</button></form>`);$('#overlay').dataset.editId=existing?.id||''}
    function estimateWalk(steps,pace){const p=state.profile;if(!p||!Number.isFinite(steps)||steps<=0||steps>100000)return null;const weight=currentMass(),height=p.heightCm;if(!Number.isFinite(weight)||!Number.isFinite(height)||height<100)return null;const strideM=height/100*0.415;const km=steps*strideM/1000;const speed=pace==='slow'?3.2:pace==='brisk'?6:4.8;const met=pace==='slow'?2.8:pace==='brisk'?4.3:3.5;const hours=km/speed;const active=Math.max(0,(met-1)*weight*hours);return {kcal:Math.round(active),km:round(km,2),minutes:Math.round(hours*60),weight,steps,pace}}
    function updateWalkPreview(){const steps=Number($('#walkSteps')?.value),pace=$('#walkPace')?.value||'normal',r=estimateWalk(steps,pace),out=$('#walkPreview');if(!out)return;if(!r){out.textContent='Enter your step count to estimate walking calories.';return}out.textContent=r.steps.toLocaleString('en')+' steps ≈ '+r.km+' km · '+r.minutes+' minutes · '+r.kcal+' active kcal (estimated)';const cal=$('#exerciseKcal');if(cal)cal.value=r.kcal;const name=$('#exerciseName');if(name)name.value='Walking ('+r.steps.toLocaleString('en')+' steps)'}
    function openExercise(){openModal(sheetTitle('Log exercise')+`<form id="exerciseForm"><div class="form-row"><label class="label" for="exerciseType">Activity type</label><select id="exerciseType" class="field"><option value="walking">Walking / steps (auto-calculate)</option><option value="manual">Other exercise (manual calories)</option></select></div><div id="walkingInputs">${field('Number of steps','walkSteps',12000,'number','min="1" max="100000" step="1" required')}<div class="form-row"><label class="label" for="walkPace">Walking pace</label><select id="walkPace" class="field"><option value="slow">Slow (3.2 km/h)</option><option value="normal" selected>Normal (4.8 km/h)</option><option value="brisk">Brisk (6 km/h)</option></select></div><p class="help" id="walkPreview"></p></div>${field('Activity name','exerciseName','Walking (12,000 steps)','text','maxlength="100" required')}${field('Calories burned (estimated)','exerciseKcal',100,'number','min="1" max="10000" step="1" required')}<p class="help">Walking estimates use your profile height and current weight to estimate distance and pace-based active calories (above resting energy). Actual stride, terrain and effort vary. Avoid double-counting activity already included in your daily calorie target.</p><button class="button full" type="submit">Add exercise</button></form>`);updateWalkPreview()}
    function toggleExerciseType(){const walk=$('#exerciseType')?.value==='walking';const block=$('#walkingInputs');if(block)block.hidden=!walk;const steps=$('#walkSteps');if(steps)steps.required=walk;if(walk)updateWalkPreview();else{$('#exerciseName').value='';$('#exerciseKcal').value=100}}
    function openWeight(){openModal(sheetTitle('Log your weight')+`<form id="weightForm">${field('Date','weightDate',selectedDate,'date','required max="'+today()+'"')}${field('Weight ('+unitWeight()+')','weightValue',round(toDisplayWeight(currentMass()),1),'number','min="1" max="1000" step="0.1" required')}<button class="button full" type="submit">Save weight</button></form>`)}
    function stopScanner(){cancelAnimationFrame(scannerRAF);scannerRAF=0;scannerReading=false;if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}}
    async function openScanner(){openModal(sheetTitle('Barcode scanner')+`<div class="scannerbox"><video id="scanVideo" class="video" autoplay playsinline muted></video><div class="scan-target"></div></div><div id="scanMessage" class="note">Point the camera at a food barcode. Camera access needs HTTPS and permission.</div><form id="barcodeForm"><div class="form-row"><label class="label" for="barcodeValue">Or type the barcode</label><input class="field" id="barcodeValue" inputmode="numeric" pattern="[0-9]{8,14}" placeholder="e.g. 3017620422003" required></div><button class="button full" type="submit">Find product</button></form>`);if(!navigator.onLine){$('#scanMessage').textContent='You are offline. Connect to look up new barcodes.';return}if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector' in window)){$('#scanMessage').textContent='Camera barcode detection is not supported by this browser. Enter the barcode manually instead.';return}try{const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=$('#scanVideo');if(!video){stopScanner();return}video.srcObject=scannerStream;await video.play();let previous=0;const scan=async timestamp=>{if(!scannerStream)return;if(!scannerReading&&timestamp-previous>400){previous=timestamp;scannerReading=true;try{const codes=await detector.detect(video);if(codes.length){const code=String(codes[0].rawValue||'').replace(/\D/g,'');if(code){stopScanner();await findBarcode(code);return}}}catch{}finally{scannerReading=false}}scannerRAF=requestAnimationFrame(scan)};scannerRAF=requestAnimationFrame(scan)}catch(err){stopScanner();if($('#scanMessage'))$('#scanMessage').textContent='Could not open camera ('+err.name+'). You can enter the barcode manually.'}}
    async function findBarcode(code){if(!/^\d{8,14}$/.test(code)){toast('Enter a barcode with 8–14 digits.');return}stopScanner();const el=$('#scanMessage');if(el)el.textContent='Looking up barcode…';if(!navigator.onLine){toast('Internet needed for barcode lookup.');return}try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=code,product_name,product_name_en,brands,serving_size,nutriments',{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('Lookup failed');const data=await r.json();const food=data.status===1?foodFromOFF(data.product):null;if(food){openFoodEntry(food,pickerMeal)}else{if($('#scanMessage'))$('#scanMessage').textContent='Product not found or missing nutrition data. Create a custom food instead.';toast('No usable product found.')}}catch{if($('#scanMessage'))$('#scanMessage').textContent='Barcode lookup unavailable. Try again later.';toast('Could not look up barcode.')}}
    function exportData(){const blob=new Blob([JSON.stringify({app:'MacroMate',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='macromate-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Backup prepared. Save it somewhere safe.')}
    function validateBackup(d){if(!d||typeof d!=='object'||Array.isArray(d))throw Error('Not a valid backup.');const x=d.data;if(d.app!=='MacroMate'||d.version!==1||!x||typeof x!=='object')throw Error('Not a MacroMate v1 backup.');if(x.profile&&validProfile(x.profile))throw Error('The profile in the backup is invalid.');if(!x.days||typeof x.days!=='object'||Array.isArray(x.days)||!Array.isArray(x.weights)||!Array.isArray(x.recent)||!Array.isArray(x.favorites)||!Array.isArray(x.customFoods)||!x.settings||!['metric','imperial'].includes(x.settings.units)||typeof x.settings.dark!=='boolean')throw Error('This backup is incomplete or invalid.');const m=x.settings.macros;if(!m||!['protein','carbs','fat'].every(k=>Number.isInteger(m[k])&&m[k]>=10&&m[k]<=80)||m.protein+m.carbs+m.fat!==100)throw Error('Macro settings are invalid.');if(Object.keys(x.days).length>20000)throw Error('Backup is too large.');for(const [k,day] of Object.entries(x.days)){if(!/^\d{4}-\d\d-\d\d$/.test(k)||!day||!Array.isArray(day.entries)||!Array.isArray(day.exercises)||!Number.isFinite(Number(day.water))||day.entries.length>1000||day.exercises.length>1000)throw Error('Invalid daily records.');for(const e of day.entries){if(!e||typeof e.name!=='string'||e.name.length>200||!['breakfast','lunch','dinner','snacks'].includes(e.meal)||!['kcal','protein','carbs','fat'].every(z=>Number.isFinite(e[z])&&e[z]>=0&&e[z]<=500000))throw Error('Invalid food record.')}for(const e of day.exercises){if(!e||typeof e.name!=='string'||!Number.isFinite(e.kcal)||e.kcal<0||e.kcal>10000)throw Error('Invalid exercise record.')}}for(const w of x.weights){if(!w||!/^\d{4}-\d\d-\d\d$/.test(w.date)||!Number.isFinite(w.kg)||w.kg<25||w.kg>450)throw Error('Invalid weight history.')}const checkFood=food=>food&&typeof food.key==='string'&&food.key.length<300&&typeof food.name==='string'&&food.name.length<=130&&food.per100&&['kcal','protein','carbs','fat'].every(k=>Number.isFinite(food.per100[k])&&food.per100[k]>=0&&food.per100[k]<=200000)&&Number.isFinite(food.portionG)&&food.portionG>0&&food.portionG<=5000;for(const group of [x.favorites,x.recent,x.customFoods]){if(group.length>20000||group.some(f=>!checkFood(f)))throw Error('Invalid saved foods.')}for(const day of Object.values(x.days)){for(const item of day.entries){if(!item.quick&&!checkFood(item.food))throw Error('Invalid food details in diary.')}}return x}
    function updateMacro(changed,newVal){const m=state.settings.macros;const newV=clamp(Math.round(newVal),10,80),other=['protein','carbs','fat'].filter(k=>k!==changed);const remain=100-newV;const theirTotal=m[other[0]]+m[other[1]];const a=clamp(Math.round(remain*(theirTotal?m[other[0]]/theirTotal:.5)),10,remain-10);m[changed]=newV;m[other[0]]=a;m[other[1]]=remain-a;save();$$('[data-macro-value]').forEach(el=>el.textContent=m[el.dataset.macroValue]+'%');$$('[data-macro]').forEach(el=>{if(el.dataset.macro!==changed)el.value=m[el.dataset.macro]});const c=calc();if($('#macroPreview'))$('#macroPreview').textContent=`At ${fmt(c.cal)} kcal: ${c.protein} g protein · ${c.carbs} g carbs · ${c.fat} g fat`}
    document.addEventListener('input',e=>{if(e.target.id==='catalogFilter'){const q=e.target.value.trim().toLowerCase();pickerFoods=FOOD_CATALOG.filter(f=>f.name.toLowerCase().includes(q));paintFoodResults()}});
    document.addEventListener('click',async e=>{if(e.target.id==='overlay'){closeModal();return}const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;if(act==='close'){closeModal();return}if(act==='goto'){view=b.dataset.view;render();window.scrollTo(0,0);return}if(act==='date-prev'||act==='date-next'){selectedDate=addDays(selectedDate,act==='date-prev'?-1:1);render();return}if(act==='water'){const day=getDay();day.water=clamp(day.water+num(b.dataset.ml),0,30000);save();render();return}if(act==='add-food'){openPicker(b.dataset.meal);return}if(act==='picker-tab'){pickerTab=b.dataset.tab;pickerFoods=[];paintPicker();return}if(act==='select-food'){const food=pickerFoods[num(b.dataset.index)];if(food)openFoodEntry(food);return}if(act==='favorite-food'){const f=JSON.parse($('#overlay').dataset.food);toggleFavorite(f);b.textContent=favorite(f)?'★ Saved':'☆ Favorite';return}if(act==='custom'){openCustom();return}if(act==='quick'){openQuick();return}if(act==='scan'){await openScanner();return}if(act==='delete-entry'){if(!confirm('Remove this food entry?'))return;getDay().entries=getDay().entries.filter(x=>x.id!==b.dataset.id);save();render();return}if(act==='edit-entry'){const entry=getDay().entries.find(x=>x.id===b.dataset.id);if(entry){pickerMeal=entry.meal;if(entry.quick)openQuick(entry);else if(entry.food)openFoodEntry(entry.food,entry.meal,entry.id)}return}if(act==='exercise'){openExercise();return}if(act==='delete-exercise'){getDay().exercises=getDay().exercises.filter(x=>x.id!==b.dataset.id);save();render();return}if(act==='log-weight'){openWeight();return}if(act==='delete-weight'){if(!confirm('Remove this weigh-in?'))return;state.weights=state.weights.filter(x=>x.id!==b.dataset.id);save();render();return}if(act==='edit-profile'){showEditProfile();return}if(act==='profile-units'){profileDraft=readProfileForm();profileFormUnits=b.dataset.units;if(editingProfile){$('#overlay .sheet').innerHTML=sheetTitle('Edit your profile')+profileFormHtml(profileDraft)}else render();return}if(act==='set-units'){state.settings.units=b.dataset.units;save();render();return}if(act==='reset-macros'){state.settings.macros={protein:30,carbs:40,fat:30};save();render();return}if(act==='export'){exportData();return}if(act==='import'){$('#importFile').click();return}if(act==='clear'){if(!confirm('Permanently clear ALL MacroMate data on this browser? Export a backup first.'))return;if(!confirm('Final confirmation: delete your profile, diary and weight history?'))return;state=structuredClone(DEFAULTS);localStorage.removeItem(STORAGE_KEY);profileDraft=null;view='home';selectedDate=today();render();toast('All local data cleared.');return}});
    document.addEventListener('input',e=>{if(e.target.id==='pickerSearch')pickerQuery=e.target.value;if(e.target.id==='walkSteps')updateWalkPreview();if(e.target.id==='servingGrams'||e.target.id==='servingsCount')updatePortionPreview();if(e.target.matches('[data-macro]'))updateMacro(e.target.dataset.macro,num(e.target.value))});
    document.addEventListener('change',async e=>{if(e.target.id==='exerciseType'){toggleExerciseType();return}if(e.target.id==='walkPace'){updateWalkPreview();return}if(e.target.id==='datePicker'&&/^\d{4}-\d\d-\d\d$/.test(e.target.value)){selectedDate=e.target.value;render()}if(e.target.id==='darkToggle'){state.settings.dark=e.target.checked;save();render()}if(e.target.id==='pGoal'){$('#paceRow').hidden=e.target.value==='maintain';const label=$('#paceRow .label');if(label)label.textContent=e.target.value==='gain'?'Gain per week':'Loss per week'}if(e.target.id==='importFile'){const file=e.target.files?.[0];if(!file)return;if(file.size>10*1024*1024){toast('Backup exceeds 10 MB.');return}try{const parsed=JSON.parse(await file.text()),incoming=validateBackup(parsed);if(!confirm('Import will replace all existing MacroMate data on this browser. Continue?'))return;state=structuredClone(DEFAULTS);Object.assign(state,incoming);profileDraft=null;profileFormUnits=state.settings.units;save();view='home';selectedDate=today();render();toast('Backup imported successfully.')}catch(err){toast('Import failed: '+err.message)}finally{e.target.value=''}}});
    document.addEventListener('submit',async e=>{const f=e.target;if(!f.id)return;e.preventDefault();if(f.id==='pickerSearchForm'){pickerQuery=$('#pickerSearch').value.trim();searchFoods(pickerQuery);return}if(f.id==='profileForm'){const p=readProfileForm();const error=validProfile(p);if(error){toast(error);return}if(editingProfile){const oldWeight=currentMass();state.profile=p;if(Math.abs(p.weightKg-oldWeight)>.01||!state.weights.length){state.weights=state.weights.filter(w=>w.date!==today());state.weights.push({id:uid(),date:today(),kg:p.weightKg});state.weights.sort((a,b)=>a.date.localeCompare(b.date))}}else{state.profile=p;state.weights=[{id:uid(),date:today(),kg:p.weightKg}]}state.settings.units=profileFormUnits;profileDraft=null;save();closeModal();render();toast('Your targets are ready!');return}if(f.id==='addFoodForm'){const food=JSON.parse($('#overlay').dataset.food),grams=num($('#servingGrams').value),qty=num($('#servingsCount').value);if(!(grams>.0&&grams<=5000&&qty>0&&qty<=100)){toast('Enter a valid serving and quantity.');return}addEntry(food,$('#overlay').dataset.meal,grams,qty,$('#overlay').dataset.editId||null);return}if(f.id==='customForm'){const name=$('#customName').value.trim(),brand=$('#customBrand').value.trim(),g=num($('#customGrams').value),qty=num($('#customQty').value);const vals=['Kcal','Protein','Carbs','Fat'].map(k=>num($('#custom'+k).value));if(!name||!g||g<=0||g>5000||qty<=0||qty>100||vals.some((v,i)=>!Number.isFinite(v)||v<0||v>(i===0?20000:1000))){toast('Check your custom food values.');return}const food={key:'custom:'+uid(),name,brand,portionG:g,per100:{kcal:round(vals[0]*100/g,3),protein:round(vals[1]*100/g,3),carbs:round(vals[2]*100/g,3),fat:round(vals[3]*100/g,3)},source:'My food'};state.customFoods.unshift(food);if($('#customFav').checked)state.favorites.unshift(food);addEntry(food,pickerMeal,g,qty);return}if(f.id==='quickForm'){const kcal=num($('#quickKcal').value),name=$('#quickName').value.trim();if(!name||!Number.isFinite(kcal)||kcal<0||kcal>20000){toast('Enter a name and valid calories.');return}const d=getDay(),id=$('#overlay').dataset.editId;const entry={id:id||uid(),meal:pickerMeal,name,quick:true,kcal:round(kcal,1),protein:0,carbs:0,fat:0};if(id){const i=d.entries.findIndex(x=>x.id===id);if(i>=0)d.entries[i]=entry}else d.entries.push(entry);save();closeModal();render();toast('Calories saved');return}if(f.id==='exerciseForm'){if($('#exerciseType')?.value==='walking'){const r=estimateWalk(Number($('#walkSteps').value),$('#walkPace').value);if(!r){toast('Enter a valid step count.');return}$('#exerciseKcal').value=r.kcal}const name=$('#exerciseName').value.trim(),kcal=num($('#exerciseKcal').value);if(!name||!Number.isFinite(kcal)||kcal<=0||kcal>10000){toast('Enter a valid exercise entry.');return}getDay().exercises.push({id:uid(),name,kcal:round(kcal)});save();closeModal();render();toast('Exercise added');return}if(f.id==='weightForm'){const date=$('#weightDate').value,w=fromWeight(num($('#weightValue').value),state.settings.units);if(!/^\d{4}-\d\d-\d\d$/.test(date)||date>today()||!Number.isFinite(w)||w<25||w>450){toast('Enter a valid date and weight.');return}state.weights=state.weights.filter(x=>x.date!==date);state.weights.push({id:uid(),date,kg:round(w,3)});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();closeModal();render();toast('Weight saved');return}if(f.id==='barcodeForm'){await findBarcode($('#barcodeValue').value.trim())}});
    window.addEventListener('online',render);window.addEventListener('offline',render);window.addEventListener('resize',()=>{if(view==='progress'&&state.profile)drawChart()});
    if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    render();
  })();
