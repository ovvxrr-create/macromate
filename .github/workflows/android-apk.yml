name: Build MacroMate Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "MacroMate Android APK" --notes "Android app wrapper for MacroMate. Debug-signed APK; download and install at your own discretion."
          gh release upload android-latest android-app/app/build/outputs/apk/debug/app-debug.apk --clobber
