abs').innerHTML=tabs.map(([k,v])=>'<button class="'+(k===tab?'active':'')+'" data-tab="'+k+'">'+v+'</button>').join('');$('#main').innerHTML=({food:foodUI,map:mapUI,meals:mealUI,recovery:recoveryUI,body:bodyUI,swap:swapUI,reminders:reminderUI,challenges:challengeUI,health:healthUI})[tab]();if(tab==='food')foodList();if(tab==='body')chart()}$('#tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}};
function foodUI(){return '<section class="card"><h2>Food photo & nutrition lookup</h2><p class="notice">A photo can be previewed, but automatic AI recognition is not available offline. Select food and portion manually; nutrition is approximate.</p><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" style="max-width:100%;max-height:220px"><input id="search" placeholder="Search Kuwaiti and everyday foods"><div id="results"></div><h3>Custom meal</h3>'+field('foodName','Food description','text')+field('cal','Calories')+field('protein','Protein g')+field('carbs','Carbs g')+field('fat','Fat g')+button('customFood','Log custom meal')+'</section><section class="card"><h2>Food logged today</h2>'+d.foods.filter(x=>x.day===date()).map(x=>'<div class="item">'+esc(x.name)+' · '+Math.round(x.cal)+' kcal</div>').join('')+'</section>'}function foodList(){let q=$('#search')?.value.toLowerCase()||'';$('#results').innerHTML=foods.filter(x=>x[0].toLowerCase().includes(q)).map(x=>'<div class="item"><b>'+esc(x[0])+'</b><small> · '+x[1]+' kcal/100g</small><div><button data-food="'+foods.indexOf(x)+'">Add portion</button></div></div>').join('')}
function mapUI(){return '<section class="card"><h2>Tap a muscle group</h2><div class="map"><div><h3>Front</h3>'+['Chest','Shoulders','Arms','Core','Legs'].map(x=>'<button data-muscle="'+x+'">'+x+'</button>').join('')+'</div><div><h3>Back</h3>'+['Back','Shoulders','Arms','Legs','Core'].map(x=>'<button data-muscle="'+x+'">'+x+'</button>').join('')+'</div></div><div id="muscleResults"></div><p>Schematic region selector, not a detailed anatomical illustration.</p></section>'}
function meals(){let breakfasts=[['Egg',150],['Oats',70],['Plain yogurt',200],['Foul medames',200],['Egg',150],['Balaleet',120],['Oats',70]],lunch=[['Chicken machboos',300],['Chicken breast',250],['Meat machboos',280],['Harees',300],['Chicken breast',250],['Shawarma wrap',250],['Chicken machboos',300]],dinner=[['Hummus',180],['White rice cooked',200],['Jireesh',250],['Chicken breast',180],['Foul medames',200],['Harees',250],['Plain yogurt',220]],snack=[['Banana',150],['Dates',40],['Plain yogurt',200],['Banana',120],['Dates',40],['Egg',100],['Banana',150]];return ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((day,i)=>{let parts=[breakfasts[i],lunch[i],dinner[i],snack[i]];return {day,parts,cal:parts.reduce((a,[name,g])=>a+(foods.find(f=>f[0]===name)?.[1]||0)*g/100,0)}})}function mealUI(){return '<section class="card"><h2>7-day meal planner</h2><p>Editable targets and a free sample menu. The menu is not automatically calibrated to your target.</p>'+field('targetCal','Daily calorie target')+field('targetProtein','Protein target (g)')+button('targets','Save targets')+' '+button('shopping','Export shopping list')+meals().map(x=>'<div class="item"><b>'+x.day+' · '+Math.round(x.cal)+' kcal</b>'+x.parts.map(([f,g])=>'<div>'+esc(f)+' · '+g+'g</div>').join('')+'</div>').join('')+'</section>'}
function recoveryUI(){return '<section class="card"><h2>Daily recovery check-in</h2>'+field('sleep','Sleep hours')+field('energy','Energy 0–10')+field('sore','Soreness 0–10')+field('stress','Stress 0–10')+button('saveRecovery','Save check-in')+'</section><section class="card"><h2>Recent recovery</h2>'+d.recovery.slice(-7).reverse().map(x=>'<div class="item">'+x.day+' · '+x.sleep+'h sleep · energy '+x.energy+'/10 · soreness '+x.sore+'/10</div>').join('')+'</section>'}
function bodyUI(){return '<section class="card"><h2>Body measurements</h2>'+['Weight kg','Waist cm','Chest cm','Arms cm','Thigh cm','Body fat %'].map((x,i)=>field('m'+i,x)).join('')+button('saveBody','Save measurements')+'</section><section class="card"><h2>Weight trend</h2><canvas id="chart" width="640" height="200"></canvas>'+d.body.slice(-8).reverse().map(x=>'<div class="item">'+x.day+' · '+x.values[0]+' kg</div>').join('')+'</section>'}function chart(){let c=$('#chart'),ctx=c.getContext('2d'),a=d.body.filter(x=>x.values[0]>0).slice(-20);ctx.fillStyle='#d6c2e8';if(a.length<2){ctx.fillText('Log two measurements to see progress',20,90);return}let min=Math.min(...a.map(x=>x.values[0]))-1,max=Math.max(...a.map(x=>x.values[0]))+1;ctx.strokeStyle='#b87bff';ctx.lineWidth=4;ctx.beginPath();a.forEach((v,i)=>{let x=20+i*600/(a.length-1),y=20+(max-v.values[0])/(max-min)*160;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function swapUI(){return '<section class="card"><h2>Exercise substitutions</h2><select id="exercise">'+movements.flatMap(g=>g.slice(1).map(n=>'<option>'+esc(n)+'</option>')).join('')+'</select><select id="equipment"><option value="all">Full gym</option><option value="home">Bodyweight / home</option><option value="dumbbell">Dumbbells</option></select>'+button('swap','Find alternatives')+'<div id="alternatives"></div><p>For pain or injury, seek professional advice rather than relying only on substitutions.</p></section>'}
function reminderUI(){return '<section class="card"><h2>Local reminders</h2><p>Notifications work only while this page remains active on supported browsers.</p><select id="reminderType"><option>Workout</option><option>Water</option><option>Meal</option><option>Weigh in</option><option>Recovery</option></select>'+field('reminderTime','Time','time')+button('addReminder','Add reminder')+' '+button('notificationPermission','Enable notifications')+d.reminders.map((x,i)=>'<div class="item">'+esc(x.type)+' · '+esc(x.time)+' <button data-delete="'+i+'">Delete</button></div>').join('')+'</section>'}
function challengesUI(){let logs=[];try{logs=JSON.parse(localStorage.getItem('macromate_workouts_v1')||'{}').logs||[]}catch{}let month=date().slice(0,7);let goals=[['12 workouts this month',logs.filter(x=>x.date?.startsWith(month)).length,12],['7 recovery check-ins',new Set(d.recovery.map(x=>x.day)).size,7],['7 food logging days',new Set(d.foods.map(x=>x.day)).size,7],['7 step logging days',new Set(d.steps.map(x=>x.day)).size,7]];return '<section class="card"><h2>Personal challenges</h2>'+goals.map(([name,done,total])=>'<div class="item"><b>'+name+'</b><p>'+Math.min(done,total)+' / '+total+(done>=total?' 🏆':'')+'</p><progress value="'+Math.min(done,total)+'" max="'+total+'" style="width:100%"></progress></div>').join('')+'</section>'}
function healthUI(){return '<section class="card"><h2>Health data</h2><p class="notice">Automatic Apple Health and Android Health Connect syncing needs native permissions and integration. This version supports manual step entry and compatible CSV import only.</p>'+field('stepDate','Date','date')+field('steps','Steps')+button('saveSteps','Save steps')+'<h3>Import date,steps CSV</h3><input id="csv" type="file" accept=".csv,text/csv">'+button('export','Export wellness backup JSON')+d.steps.slice(-12).reverse().map(x=>'<div class="item">'+esc(x.day)+' · '+x.steps+' steps</div>').join('')+'</section>'}
function download(text,name,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('#main').addEventListener('input',e=>{if(e.target.id==='search')foodList()});$('#main').addEventListener('click',e=>{let t=e.target;if(t.dataset.food!==undefined){let f=foods[+t.dataset.food],grams=prompt('Portion in grams','200');if(grams!==null&&n(grams)>0&&n(grams)<5000){let q=n(grams)/100;d.foods.push({day:date(),name:f[0],cal:f[1]*q,p:f[2]*q,c:f[3]*q,f:f[4]*q});save();render()}}if(t.id==='customFood'){let name=$('#foodName').value.trim();if(!name)return alert('Enter a name');d.foods.push({day:date(),name,cal:n($('#cal').value),p:n($('#protein').value),c:n($('#carbs').value),f:n($('#fat').value)});save();render()}if(t.dataset.muscle){let g=movements.find(x=>x[0]===t.dataset.muscle);$('#muscleResults').innerHTML='<h3>'+g[0]+'</h3>'+g.slice(1).map(x=>'<p>'+esc(x)+'</p>').join('')+'<a href="./gym.html">Full exercise instructions →</a>'}if(t.id==='targets'){d.targets={cal:n($('#targetCal').value),protein:n($('#targetProtein').value)};save();alert('Targets saved. Sample menu remains unchanged.')}if(t.id==='shopping'){let items={};for(let day of meals())for(let [name,g] of day.parts)items[name]=(items[name]||0)+g;download(Object.entries(items).map(([x,g])=>x+': '+g+'g').join(String.fromCharCode(10)),'macromate-shopping.txt','text/plain')}if(t.id==='saveRecovery'){let x={day:date(),sleep:n($('#sleep').value),energy:n($('#energy').value),sore:n($('#sore').value),stress:n($('#stress').value)};if(x.sleep<0||x.sleep>24)return alert('Invalid sleep');d.recovery.push(x);save();render()}if(t.id==='saveBody'){let values=Array.from({length:6},(_,i)=>n($('#m'+i).value));if(!values[0]&&!values[1])return alert('Enter a measurement');d.body.push({day:date(),values});save();render()}if(t.id==='swap'){let x=$('#exercise').value,g=movements.find(a=>a.includes(x)),mode=$('#equipment').value;let a=g.slice(1).filter(v=>v!==x&&(mode==='all'||(mode==='home'&&/push-up|pull-up|plank|bird dog|dead bug|bodyweight/.test(v.toLowerCase()))||(mode==='dumbbell'&&/dumbbell|goblet|curl|raise/.test(v.toLowerCase()))));$('#alternatives').innerHTML=a.length?a.map(v=>'<div class="item">'+esc(v)+'</div>').join(''):'<p>No matching alternative in the current library.</p>'}if(t.id==='addReminder'){if(!$('#reminderTime').value)return alert('Select time');d.reminders.push({type:$('#reminderType').value,time:$('#reminderTime').value});save();render()}if(t.dataset.delete!==undefined){d.reminders.splice(+t.dataset.delete,1);save();render()}if(t.id==='notificationPermission'&&'Notification'in window)Notification.requestPermission();if(t.id==='saveSteps'){let day=$('#stepDate').value,steps=n($('#steps').value);if(!day||steps<0||steps>100000)return alert('Invalid steps');d.steps.push({day,steps});save();render()}if(t.id==='export')download(JSON.stringify(d,null,2),'macromate-wellness.json','application/json')});
$('#main').addEventListener('change',e=>{if(e.target.id==='photo'){let f=e.target.files[0];if(f&&f.type.startsWith('image/')&&f.size<15000000){let u=URL.createObjectURL(f);$('#preview').src=u;$('#preview').onload=()=>URL.revokeObjectURL(u)}}if(e.target.id==='csv'){let f=e.target.files[0];if(!f||f.size>1000000)return;f.text().then(t=>{let count=0;for(let line of t.trim().split(/\r?\n/).slice(1,10001)){let [day,steps]=line.split(',');if(/^\d{4}-\d{2}-\d{2}$/.test(day)&&n(steps)>0&&n(steps)<100000){d.steps.push({day,steps:n(steps)});count++}}save();render();alert('Imported '+count+' step records')})}});
setInterval(()=>{if(!('Notification'in window)||Notification.permission!=='granted')return;let now=new Date(),time=now.toTimeString().slice(0,5),stamp=date()+time;for(let r of d.reminders)if(r.time===time&&r.last!==stamp){r.last=stamp;save();new Notification('MacroMate',{body:r.type})}},30000);render();
</script></body></html>
